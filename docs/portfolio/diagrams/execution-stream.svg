<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<style id="embedded-diagram-fonts">@font-face{font-family:PortfolioDiagram;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PortfolioDiagram;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:PortfolioDiagram,sans-serif!important}</style>

<title id="title">검사와 제어를 분리하되 명령 전송은 하나의 실행기가 담당</title>
<desc id="desc">정책의 다음 동작 후보를 별도 작업에서 충돌과 기구학 검사한다. 현재 실행의 상태 확인과 취소 처리는 계속한다. 결과가 돌아오면 같은 실행기가 현재 상태와 장면을 재확인한 뒤 다음 명령을 전송한다. 선 길이는 측정 시간이나 속도를 나타내지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd5a34"/></marker></defs>
<style>text{font-family:sans-serif;fill:#20343e}.lane{font-size:20px;font-weight:700}.sub{font-size:16px;fill:#637d89}.head{font-size:28px;font-weight:700}</style>
<text x="34" y="48" class="head">Check ahead. Keep control.</text>
<text x="1165" y="46" text-anchor="end" class="sub">ASYNC VALIDATION · SINGLE COMMAND OWNER</text>
<path d="M34 77H1165" stroke="#cbd7dd"/>
<text x="34" y="140" class="lane">POLICY</text><text x="34" y="166" class="sub">Candidate actions</text>
<g fill="#dbe7ed"><rect x="258" y="117" width="37" height="43" rx="3"/><rect x="301" y="117" width="37" height="43" rx="3"/><rect x="344" y="117" width="37" height="43" rx="3"/><rect x="387" y="117" width="37" height="43" rx="3"/></g>
<path d="M447 140H560V224" fill="none" stroke="#bd5a34" stroke-width="2" marker-end="url(#arrow)"/>
<text x="34" y="250" class="lane">GEOMETRY</text><text x="34" y="276" class="sub">Separate worker</text>
<rect x="258" y="230" width="529" height="61" rx="5" fill="#f1f5f7"/>
<path d="M272 244L296 268M295 244L319 268M318 244L342 268M341 244L365 268" stroke="#cbd7dd" stroke-width="2"/>
<text x="555" y="269" text-anchor="middle" class="lane">Collision + FK</text>
<path d="M787 259H832V359" fill="none" stroke="#bd5a34" stroke-width="2" marker-end="url(#arrow)"/>
<text x="862" y="306" class="sub">Checked candidate</text>
<text x="34" y="387" class="lane">CONTROL</text><text x="34" y="413" class="sub">One execution owner</text>
<path d="M258 384H1144" stroke="#345f72" stroke-width="5"/>
<g fill="#345f72" stroke="white" stroke-width="3"><circle cx="285" cy="384" r="8"/><circle cx="376" cy="384" r="8"/><circle cx="467" cy="384" r="8"/><circle cx="558" cy="384" r="8"/><circle cx="649" cy="384" r="8"/><circle cx="740" cy="384" r="8"/></g>
<path d="M832 364L852 384L832 404L812 384Z" fill="#bd5a34" stroke="white" stroke-width="3"/>
<path d="M858 384H1144" stroke="#bd5a34" stroke-width="5" marker-end="url(#arrow)"/>
<text x="1010" y="360" text-anchor="middle" class="sub">Next command</text>
<text x="500" y="453" text-anchor="middle" class="lane">Status · watchdog · cancel</text>
<text x="833" y="435" text-anchor="middle" class="sub">Recheck</text><text x="833" y="459" text-anchor="middle" class="sub">state + scene</text>
<text x="1144" y="435" text-anchor="end" class="lane">FR5</text>
</svg>
