<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="operator-token" content="browser-regression-token">
  <title>FR5 data factory browser regressions</title>
  <base href="../">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="connection-banner" role="status" aria-live="polite"></div>
  <span id="connection-dot"></span><span id="connection-label"></span><span id="session-label"></span>
  <main id="collection-app">
    <nav class="step-rail"><ol>
      <li><button data-step-target="environment">environment</button></li><li><button data-step-target="plan">plan</button></li>
      <li><button data-step-target="review">review</button></li><li><button data-step-target="execution">execution</button></li>
      <li><button data-step-target="results">results</button></li><li><button data-step-target="next">next</button></li>
    </ol></nav>
    <div class="work-area">
      <section id="campaign-facts" hidden></section><button id="cancel-campaign" type="button" hidden>cancel</button>
      <div id="step-content">
        <section id="step-environment" class="flow-step" data-step="environment" tabindex="-1"><p id="setup-summary"></p><ul id="setup-subsystems"></ul><section id="camera-setup" hidden><strong id="camera-profile-label"></strong><div id="camera-role-list"></div><p id="camera-role-status"></p></section><button id="prepare-environment" hidden>prepare</button><button id="recover-home" hidden>recover</button><button id="environment-next">next</button></section>
        <section id="step-plan" class="flow-step" data-step="plan" tabindex="-1" hidden>
          <div class="setup-tools"><div id="workspace-entry" hidden><strong>작업영역 관리</strong><button id="open-workspace" type="button">새 작업영역 등록</button></div><div id="start-pose-entry" hidden><strong>시작 자세 관리</strong><button id="open-start-pose" type="button">시작 자세 관리</button></div></div>
          <fieldset id="catalog-fields">
            <select data-axis="workspace"></select><small data-axis-hint="workspace"></small><select id="frame-select" data-axis="frame"></select><small data-axis-hint="frame"></small>
            <select data-axis="task"></select><small data-axis-hint="task"></small><select data-axis="object"></select><small data-axis-hint="object"></small>
            <select data-axis="grasp"></select><small data-axis-hint="grasp"></small><select data-axis="start" hidden></select><small data-axis-hint="start" hidden></small>
            <select data-axis="motion"></select><small data-axis-hint="motion"></small><select data-axis="variant"></select><small data-axis-hint="variant"></small>
            <div><strong id="camera-selection-label"></strong><select data-axis="camera" hidden></select><small data-axis-hint="camera" hidden></small></div><select data-axis="data_mode"></select><small data-axis-hint="data_mode"></small>
          </fieldset>
          <fieldset id="authoring-mode"><label><input type="radio" name="authoring_mode" value="ASSISTED">assisted</label><label><input type="radio" name="authoring_mode" value="DIRECT_EDIT">direct</label></fieldset>
          <label>count<input id="count-input" type="number" min="1" max="100"></label><label>repeat<input id="repeat-input" type="number" min="1" max="100"></label><select id="split-select" data-axis="split"></select>
          <h4 id="current-object-title">current object</h4><p id="current-object-status"></p><form id="current-object-form"><label>X<input id="current-object-x" type="number" step="any" required></label><label>Y<input id="current-object-y" type="number" step="any" required></label><label>yaw<input id="current-object-yaw" type="number" step="any" required></label><button id="apply-current-object" type="submit">apply</button></form>
          <dl id="state-space-summary" hidden></dl><p id="workspace-domain-summary"></p>
          <section id="direct-pose-editor" hidden><h4 id="direct-pose-title">direct</h4><p id="direct-domain-status"></p><form id="direct-pose-form"><label id="direct-start-label" hidden>start<select id="direct-start-select"></select></label><label>X<input id="direct-x-input" type="number" step="any" required></label><label>Y<input id="direct-y-input" type="number" step="any" required></label><label>yaw<input id="direct-yaw-input" type="number" step="any" required></label><button id="add-direct-pose" type="submit">add</button></form><span id="direct-selection-count"></span><ol id="direct-pose-list"></ol></section>
          <p id="plan-lock-reason"></p><details id="cell-grid-disclosure" hidden><summary>grid</summary><div id="cell-grid"></div></details><button id="plan-back">back</button><button id="compile-campaign">compile</button>
        </section>
        <section id="step-review" class="flow-step" data-step="review" tabindex="-1" hidden><dl id="review-summary"></dl><section id="review-plan" hidden><h3 id="review-plan-title">plan</h3><ol id="review-plan-list"></ol></section><button id="review-back">back</button><div id="review-actions"></div></section>
        <section id="step-execution" class="flow-step" data-step="execution" tabindex="-1" hidden><div id="runtime-content"></div></section>
        <section id="step-results" class="flow-step" data-step="results" tabindex="-1" hidden><ol id="episode-results"></ol><div id="coverage-summary"></div><div id="review-queue"></div><button id="results-next">next</button></section>
        <section id="step-next" class="flow-step" data-step="next" tabindex="-1" hidden><div id="same-settings-action"></div></section>
      </div>
      <details id="technical-details"><summary>technical</summary><dl id="technical-content"></dl></details>
    </div>
  </main>
  <dialog id="workspace-dialog">
    <h2 id="workspace-dialog-title">새 작업영역 등록</h2>
    <button id="close-workspace" type="button">close</button>
    <form id="workspace-name-form"><input id="workspace-display-name" type="text" required><button type="submit">begin</button></form>
    <section id="workspace-registration-content" hidden><dl id="workspace-selection"></dl><p id="workspace-next-action" role="status"></p><ol id="workspace-captures"></ol>
      <form id="workspace-preview-form" hidden>
        <input id="source-scale-bar" type="number" min="0.01" step="any" required>
        <input id="final-scale-bar" type="number" min="96" max="104" step="any" required>
        <button id="preview-workspace" type="submit">preview</button>
      </form>
      <div id="workspace-preview-status"></div><div id="workspace-promotion"></div>
    </section>
  </dialog>
  <dialog id="start-pose-dialog"><h2 id="start-pose-dialog-title">시작 자세 관리</h2><button id="close-start-pose">close</button><form id="start-pose-capture-form"><input id="start-pose-display-name" type="text" required><button id="capture-start-pose">capture</button></form><div id="start-pose-profile-list"></div><p id="start-pose-status"></p></dialog>
  <div id="announcer" role="status"></div>
  <pre id="results">픽스처 대기 중…</pre>

  <script>
    const nativeFetch = window.fetch.bind(window);
    const fixturePromise = nativeFetch("../fixtures/states.json").then((response) => response.json());
    const posted = [];
    let stateKey = "authoring";
    let postResult = "accepted";
    let networkFailure = false;
    let bridgeTokenRejected = false;
    let sessionIdOverride;
    let draftAuthoringMode;
    let draftRequestedCount;
    let draftRepeat;
    let directPoses = [];
    let directPairs = [];
    let workspaceDomainAvailable = true;
    let workspaceRegistrationVisible = true;
    let workspaceOperationsEnabled = true;
    let workspaceRegistrationState;
    let workspaceCatalogRefreshed = false;
    let rejectNextWorkspacePreview = false;
    let cameraSetupState;
    let startPoseSetupState;
    let cameraRecovered = false;
    let authoringRevision = 1;
    let authoringDigest;
    let authoringSetupSummary;
    let cameraBindingOperationAvailable = true;
    let stateSpaceProjectionAvailable = true;
    const snapshotProbe = "RAW_SNAPSHOT_MUST_NOT_RENDER";
    const workspaceDomain = {
      workspace_id: "PLACE_A", frame_id: "place-a-frame-r002", object_id: "wood-cube-25mm-r001", coordinate_mode: "CONTINUOUS_A4_PLANE",
      x_mm: {minimum: -158.26323009467487, maximum: 158.26323009467487}, y_mm: {minimum: -158.26323009467487, maximum: 158.26323009467487}, yaw_deg: {minimum: -180, maximum_exclusive: 180},
    };
    const clone = (value) => JSON.parse(JSON.stringify(value));
    const merge = (target, patch) => {
      for (const [key, value] of Object.entries(patch)) target[key] = value && typeof value === "object" && !Array.isArray(value) ? merge({...target[key]}, value) : clone(value);
      return target;
    };
    const fixtureView = async () => {
      const fixture = await fixturePromise;
      const flat = merge(clone(fixture.base_view), fixture.states[stateKey]);
      if (stateKey === "results") flat.episode_history.forEach((item, index) => {
        item.episode_ledger = {
          ledger_digest: `sha256:${String(index + 1).repeat(64)}`,
          review_status: "NOT_MEASURED", retention_state: "PRESERVE",
          reclaim_state: "REPACK_REQUIRED", training_status: "NOT_AUTHORIZED",
        };
      });
      if (stateKey === "authoring") {
        flat.revision = authoringRevision;
        if (authoringDigest) flat.view_digest = authoringDigest;
        if (authoringSetupSummary) flat.setup.summary = authoringSetupSummary;
        flat.draft.authoring_mode = draftAuthoringMode ?? flat.draft.authoring_mode;
        flat.draft.requested_count = draftRequestedCount ?? flat.draft.requested_count;
        flat.draft.repeat = draftRepeat ?? flat.draft.repeat;
        flat.draft.direct_poses = clone(directPoses);
        flat.draft.direct_pairs = clone(directPairs);
        if (workspaceDomainAvailable) flat.catalog.workspace_domain = clone(workspaceDomain);
        else delete flat.catalog.workspace_domain;
        workspaceRegistrationState ??= clone(flat.workspace_registration);
        cameraSetupState ??= clone(flat.camera_setup);
        startPoseSetupState ??= clone(flat.start_pose_setup);
        flat.camera_setup = clone(cameraSetupState);
        flat.start_pose_setup = clone(startPoseSetupState);
        flat.state_space_summary.selected_start_pose_count = startPoseSetupState.selected_start_pose_ids.length;
        flat.state_space_summary.eligible_pair_count = 15 * startPoseSetupState.selected_start_pose_ids.length;
        flat.state_space_summary.planned_count = flat.draft.requested_count;
        if (!stateSpaceProjectionAvailable) {
          delete flat.start_pose_setup;
          delete flat.state_space_summary;
          delete flat.draft.direct_pairs;
        }
        flat.workspace_registration = workspaceRegistrationVisible && workspaceRegistrationState ? {...clone(workspaceRegistrationState), raw_joint_snapshot: snapshotProbe} : null;
        const workspaceOps = [];
        if (workspaceRegistrationVisible && workspaceOperationsEnabled) {
          if (!workspaceRegistrationState || workspaceRegistrationState.promotion) workspaceOps.push("new_workspace_registration");
          else if (workspaceRegistrationState.preview?.status === "CANDIDATE_WITHIN_TOLERANCE") workspaceOps.push("save_workspace");
          else if (workspaceRegistrationState.preview) workspaceOps.push("discard_workspace_preview");
          else {
            workspaceOps.push("capture_workspace_point");
            if (Object.values(workspaceRegistrationState.captures).every(Boolean)) workspaceOps.push("preview_workspace");
          }
        }
        flat.available_ops = ["update_draft", ...(cameraBindingOperationAvailable ? ["update_camera_bindings"] : []), ...(stateSpaceProjectionAvailable ? ["capture_start_pose", "update_start_pose_selection"] : []), "compile_draft", ...workspaceOps];
        if (workspaceCatalogRefreshed && workspaceRegistrationState && !flat.catalog.axes.frame.some((item) => item.id === workspaceRegistrationState.calibration_id)) {
          flat.catalog.axes.frame.push({id: workspaceRegistrationState.calibration_id, label: "새 작업영역 좌표계 r1", available: true, reason: null, description: "같은 프로세스에서 새로고침됨"});
        }
        if (cameraRecovered) {
          flat.revision = 15;
          flat.view_digest = "sha256:2323232323232323232323232323232323232323232323232323232323232323";
          flat.runtime.workflow_state = "PREPARING";
          flat.setup.host_status = "ACTION_REQUIRED";
          flat.setup.summary = "카메라 역할을 다시 확인한 뒤 환경 준비를 실행하세요.";
          flat.available_ops = ["prepare_environment", "update_camera_bindings"];
        }
      }
      if (stateKey === "workspace_motion_required" && !flat.catalog.axes.frame.some((item) => item.id === flat.draft.selection.frame)) {
        flat.catalog.axes.frame.push({id: flat.draft.selection.frame, label: "새 작업영역 좌표계 r1", available: true, reason: null, description: "저장됨"});
      }
      if (sessionIdOverride) flat.session_id = sessionIdOverride;
      const {schema_version, session_id, revision, generated_at, view_digest, ...projection} = flat;
      return {schema_version, session_id, revision, generated_at, view_digest, projection, authority: {browser: "INTENT_ONLY", training_approval: "SEPARATE"}};
    };
    window.fetch = async (input, init = {}) => {
      const path = new URL(typeof input === "string" ? input : input.url, location.href).pathname;
      if (networkFailure && path.startsWith("/api/")) throw new TypeError("fixture network down");
      if (bridgeTokenRejected && path === "/api/view") return new Response(JSON.stringify({schema_version: "data_factory.operator_intent_result.v1", ok: false, code: "BRIDGE_TOKEN", consumed: false}), {status: 403, headers: {"Content-Type": "application/json"}});
      if (path === "/api/view") return new Response(JSON.stringify(await fixtureView()), {status: 200, headers: {"Content-Type": "application/json"}});
      if (path === "/api/view/watch") return new Promise((_resolve, reject) => {
        const abort = () => reject(new DOMException("Aborted", "AbortError"));
        if (init.signal?.aborted) abort();
        else init.signal?.addEventListener("abort", abort, {once: true});
      });
      if (path === "/api/intent") {
        const fixture = await fixturePromise;
        const request = {headers: new Headers(init.headers), body: JSON.parse(init.body)};
        posted.push(request);
        if (postResult === "accepted") {
          if (request.body.op === "update_draft") {
            const payload = request.body.payload;
            if (payload.authoring_mode === "DIRECT_EDIT" && draftAuthoringMode !== "DIRECT_EDIT") directPairs = [
              {start_pose_id: "fr5-home-r001", place_id: "PLACE_A", x_mm: 0, y_mm: 0, yaw_deg: 0},
              {start_pose_id: "fr5-home-r001", place_id: "PLACE_A", x_mm: 10, y_mm: 10, yaw_deg: 90},
              {start_pose_id: "fr5-home-r001", place_id: "PLACE_A", x_mm: -10, y_mm: -10, yaw_deg: -180},
            ];
            if (payload.authoring_mode === "ASSISTED") directPairs = [];
            if (payload.authoring_mode) draftAuthoringMode = payload.authoring_mode;
            if (payload.requested_count) draftRequestedCount = payload.requested_count;
            if (payload.repeat) draftRepeat = payload.repeat;
            if (payload.add_pose) directPoses.push({...payload.add_pose, yaw_deg: ((payload.add_pose.yaw_deg + 180) % 360 + 360) % 360 - 180});
            if (payload.remove_pose) directPoses = directPoses.filter((pose) => !["place_id", "x_mm", "y_mm", "yaw_deg"].every((field) => pose[field] === payload.remove_pose[field]));
            if (payload.add_pair) directPairs.push({...payload.add_pair, yaw_deg: ((payload.add_pair.yaw_deg + 180) % 360 + 360) % 360 - 180});
            if (payload.remove_pair) directPairs = directPairs.filter((pair) => !["start_pose_id", "place_id", "x_mm", "y_mm", "yaw_deg"].every((field) => pair[field] === payload.remove_pair[field]));
          }
          if (request.body.op === "capture_workspace_point") workspaceRegistrationState.captures[request.body.payload.label] = true;
          if (request.body.op === "preview_workspace") {
            workspaceRegistrationState.preview = clone(fixture.states.workspace_previewed.workspace_registration.preview);
            if (rejectNextWorkspacePreview) workspaceRegistrationState.preview.status = "CANDIDATE_OUT_OF_TOLERANCE";
          }
          if (request.body.op === "discard_workspace_preview") workspaceRegistrationState.preview = null;
          if (["save_workspace", "save_workspace_revision"].includes(request.body.op)) {
            workspaceRegistrationState = clone(fixture.states.workspace_saved.workspace_registration);
            workspaceCatalogRefreshed = true;
          }
          if (request.body.op === "new_workspace_registration") {
            workspaceRegistrationState = clone(fixture.states.workspace_captured.workspace_registration);
            workspaceRegistrationState.display_name = request.body.payload.display_name;
            workspaceRegistrationState.captures = {CENTER: false, X_REF: false, Y_CHECK: false};
            workspaceRegistrationState.preview = null;
            workspaceRegistrationState.promotion = null;
          }
          if (request.body.op === "capture_start_pose") startPoseSetupState.profiles.push({start_pose_id: `captured-${startPoseSetupState.profiles.length + 1}`, display_name: request.body.payload.display_name, status: "CANDIDATE"});
          if (request.body.op === "update_start_pose_selection") startPoseSetupState.selected_start_pose_ids = clone(request.body.payload.selected_start_pose_ids);
          if (request.body.op === "update_camera_bindings") {
            cameraSetupState.bindings = clone(request.body.payload.bindings);
            cameraSetupState.required_roles = [...new Set(Object.values(cameraSetupState.bindings).filter((role) => role !== "UNUSED"))];
            const labels = {UP: "상단", SIDE: "측면", WRIST: "손목"};
            cameraSetupState.profile_label = `${cameraSetupState.required_roles.map((role) => labels[role]).join(" + ")} RGB · 30 fps`;
          }
          if (request.body.op === "compile_draft") stateKey = "review_campaign";
          if (request.body.op === "authorize_campaign") stateKey = "running";
          if (request.body.op === "cancel_session") stateKey = "cancelling";
          if (request.body.op === "review_candidate") stateKey = "complete";
          if (request.body.op === "recover_camera_setup") { cameraRecovered = true; stateKey = "authoring"; }
        }
        const result = fixture.intent_results[postResult];
        return new Response(JSON.stringify(result), {status: result.ok ? 200 : 409, headers: {"Content-Type": "application/json"}});
      }
      return nativeFetch(input, init);
    };
  </script>
  <script src="messages.js"></script>
  <script src="app.js"></script>
  <script>
    const output = document.querySelector("#results");
    const checks = [];
    const check = (condition, label) => { if (!condition) throw new Error(label); checks.push(label); };
    const waitFor = async (predicate, timeout = 2500) => {
      const started = performance.now();
      while (!predicate()) {
        if (performance.now() - started > timeout) throw new Error("timeout");
        await new Promise((resolve) => setTimeout(resolve, 10));
      }
    };
    const show = async (key) => {
      stateKey = key;
      await loadView();
      const expected = {authoring: 1, review_campaign: 2, running: 3, cancelling: 4, results: 5, complete: 6, blocked: 7, stale: 8, workspace_motion_required: 12, camera_blocked: 14}[key];
      await waitFor(() => currentView?.revision === expected || !currentView);
    };

    async function run() {
      try {
        await waitFor(() => currentView?.revision === 1);
        check(document.body.dataset.bridge === "ready", "ready view is explicit");
        check(document.querySelectorAll("[data-step-target]").length === 6, "six-step product flow renders");
        check(document.querySelector("#step-environment").hidden && !document.querySelector("#step-plan").hidden, "AUTHORING enters collection plan directly");
        check(!document.querySelector('[data-step-target="plan"]').disabled, "ready environment unlocks collection planning");
        check(!document.querySelector("#camera-setup").hidden && document.querySelectorAll("#camera-role-list select").length === 2, "environment lists two connected cameras by logical label");
        check(["상단", "측면", "손목", "사용 안 함"].every((label) => document.querySelector("#camera-role-list").textContent.includes(label)), "each camera exposes plain-language role choices");
        check(!document.querySelector("#camera-setup").textContent.includes("usb-") && document.querySelector("#technical-content").textContent.includes("usb-Generic"), "technical camera identity stays in collapsed technical details");
        check(document.querySelector('[data-axis="camera"]').hidden && document.querySelector('[data-axis="camera"]').disabled && document.querySelector("#camera-selection-label").textContent.includes("상단 RGB"), "camera profile is derived instead of manually selected in the plan");
        const camera2 = document.querySelector('[data-camera-logical-id="camera-2"]');
        camera2.value = "WRIST";
        camera2.dispatchEvent(new Event("change", {bubbles: true}));
        await waitFor(() => currentView?.camera_setup?.bindings["camera-2"] === "WRIST" && !intentBusy);
        const firstCameraPost = posted.find((item) => item.body.op === "update_camera_bindings");
        check(JSON.stringify(firstCameraPost.body.payload.bindings) === JSON.stringify({"camera-1": "UP", "camera-2": "WRIST"}), "camera role change posts one complete binding map");
        const camera1 = document.querySelector('[data-camera-logical-id="camera-1"]');
        camera1.value = "WRIST";
        camera1.dispatchEvent(new Event("change", {bubbles: true}));
        await waitFor(() => currentView?.camera_setup?.bindings["camera-1"] === "WRIST" && !intentBusy);
        check(currentView.camera_setup.bindings["camera-2"] === "UP" && new Set(Object.values(currentView.camera_setup.bindings)).size === 2, "occupied camera roles swap atomically without duplicates");

        document.querySelector('[data-step-target="environment"]').click();
        const focusedCamera = document.querySelector('[data-camera-logical-id="camera-2"]');
        focusedCamera.focus();
        cameraSetupState.bindings = {"camera-1": "SIDE", "camera-2": "UP"};
        cameraSetupState.required_roles = ["SIDE", "UP"];
        authoringRevision = 2;
        authoringDigest = "sha256:2424242424242424242424242424242424242424242424242424242424242424";
        authoringSetupSummary = "최신 비카메라 상태도 함께 반영됨";
        const focusPostStart = posted.length;
        await loadView();
        const focusPreserved = document.activeElement === focusedCamera && document.querySelector('[data-camera-logical-id="camera-2"]') === focusedCamera;
        focusedCamera.value = "WRIST";
        focusedCamera.dispatchEvent(new Event("change", {bubbles: true}));
        await waitFor(() => currentView?.camera_setup?.bindings["camera-2"] === "WRIST" && !intentBusy);
        const latestCameraPost = posted.slice(focusPostStart).find((item) => item.body.op === "update_camera_bindings");
        const latestStatusRendered = document.querySelector("#setup-summary").textContent.includes(authoringSetupSummary);
        const operationLossCamera = document.querySelector('[data-camera-logical-id="camera-2"]');
        operationLossCamera.focus();
        cameraBindingOperationAvailable = false;
        authoringRevision = 3;
        authoringDigest = "sha256:2525252525252525252525252525252525252525252525252525252525252525";
        await loadView();
        const operationLossReprojected = document.querySelector('[data-camera-logical-id="camera-2"]') !== operationLossCamera
          && document.querySelector('[data-camera-logical-id="camera-2"]').disabled;
        check(focusPreserved && latestStatusRendered && latestCameraPost.body.view_revision === 2
          && JSON.stringify(latestCameraPost.body.payload.bindings) === JSON.stringify({"camera-1": "SIDE", "camera-2": "WRIST"})
          && posted.slice(focusPostStart).every((item) => item.body.op !== "prepare_environment") && operationLossReprojected,
        "focused camera polling consumes non-camera status and posts latest revision/bindings without auto-prepare, then operation loss reprojects");
        cameraBindingOperationAvailable = true;
        authoringRevision = 1;
        authoringDigest = undefined;
        authoringSetupSummary = undefined;
        sessionIdOverride = "collection-operator-r002";
        await loadView();
        await waitFor(() => currentView?.session_id === sessionIdOverride && currentView?.revision === 1);
        document.querySelector('[data-step-target="plan"]').click();
        check(document.querySelector('[data-axis="start"]').hidden && !document.querySelector("#open-start-pose").hidden && document.querySelector("#catalog-fields").textContent.includes("시작 자세"), "legacy start dropdown is replaced by reusable start-pose management");
        check([...document.querySelector('[data-axis="task"]').options].some((option) => option.value === "pick_place" && option.disabled), "unavailable catalog combination is disabled with a reason");
        const selectedTask = catalogOption(currentView, "task", currentView.draft.selection.task);
        selectedTask.description = "현재 화면 상태에 포함된 레시피 정보";
        for (const [code, copy] of [
          ["GENERAL_QUALIFICATION_REQUIRED", "일반 수집 전에 이 조합의 실제 장치 동작을 먼저 확인해야 합니다"],
          ["TASK_CALLER_NOT_CONFIGURED", "이 작업을 실행할 연결이 아직 설정되지 않았습니다"],
